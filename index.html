<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Tạp Hóa Thanh Trúc</title>
    <meta name="description" content="Danh mục hàng tạp hóa, chọn nhanh bằng chữ cái đầu và sao chép danh sách đi lấy hàng.">
    <meta name="theme-color" content="#0f1420">
    <meta name="color-scheme" content="dark">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tạp Hóa">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Icon sprite: one copy, referenced everywhere with <use>. -->
<svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M3 4h2.2l2.3 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.55L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></symbol>
    <symbol id="i-note" viewBox="0 0 24 24"><path d="M15.5 3.5l5 5L9 20H4v-5z"/><path d="M13.5 5.5l5 5"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4.5V10h5.5"/><path d="M12 8v4.5l3 1.8"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9.5 4h5"/><path d="M6.5 7l1 12.2a1.8 1.8 0 0 0 1.8 1.8h5.4a1.8 1.8 0 0 0 1.8-1.8L18 7"/><path d="M10.5 11v6M13.5 11v6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.8l5 5.2L19.5 6.5"/></symbol>
    <symbol id="i-undo" viewBox="0 0 24 24"><path d="M4 9h9.5A5.5 5.5 0 0 1 19 14.5v0A5.5 5.5 0 0 1 13.5 20H8"/><path d="M8 4.5L3.5 9 8 13.5"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.9-5.2 2.9 1-5.9L3.5 9.7l5.9-.8z"/></symbol>
</svg>

<div id="app">
    <header id="top-bar">
        <button id="menu-btn" class="icon-btn" aria-label="Mở danh mục" aria-expanded="false" aria-controls="sidebar">
            <svg class="ico"><use href="#i-menu"/></svg>
        </button>

        <div class="brand">
            <h1>Tạp Hóa Thanh Trúc</h1>
            <p id="current-time">—</p>
        </div>

        <div class="top-actions">
            <button id="note-icon" class="icon-btn" aria-label="Kiểm hàng">
                <svg class="ico"><use href="#i-note"/></svg>
                <span id="note-count" class="dot" hidden>0</span>
            </button>
            <button id="cart-icon" class="icon-btn cart-btn" aria-label="Giỏ hàng">
                <svg class="ico"><use href="#i-cart"/></svg>
                <span id="cart-count" class="count">0</span>
            </button>
        </div>
    </header>

    <div class="search-row">
        <label class="search-box" for="search-box">
            <svg class="ico"><use href="#i-search"/></svg>
            <input type="text" id="search-box" placeholder="Gõ tên hoặc chữ cái đầu (vd: mhh)" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
            <button id="search-clear" class="icon-btn tiny" type="button" aria-label="Xoá tìm kiếm" hidden>
                <svg class="ico"><use href="#i-close"/></svg>
            </button>
        </label>
    </div>

    <main id="product-container" class="product-container" aria-live="polite"></main>

    <div id="empty-state" class="empty-state" hidden>
        <svg class="ico big"><use href="#i-search"/></svg>
        <p>Không tìm thấy sản phẩm nào</p>
        <button id="empty-reset" class="btn btn-ghost" type="button">Xoá bộ lọc</button>
    </div>
</div>

<div id="scrim" class="scrim"></div>

<aside id="sidebar" class="sidebar" aria-label="Danh mục sản phẩm" aria-hidden="true">
    <div class="sidebar-head">
        <h2>Danh Mục</h2>
        <button class="icon-btn" data-close-sidebar aria-label="Đóng danh mục">
            <svg class="ico"><use href="#i-close"/></svg>
        </button>
    </div>
    <ul id="categories"></ul>
    <div class="sidebar-foot">
        <button id="history-btn" class="sidebar-link" type="button">
            <svg class="ico"><use href="#i-history"/></svg>
            <span>Xem lịch sử</span>
        </button>
        <button id="update-btn" class="sidebar-link accent" type="button">
            <svg class="ico"><use href="#i-star"/></svg>
            <span>Cập nhật bản mới</span>
        </button>
    </div>
</aside>

<!-- ================= GIỎ HÀNG ================= -->
<section id="cart-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="cart-title">
    <header class="ov-head">
        <h2 id="cart-title">
            <svg class="ico"><use href="#i-cart"/></svg>
            Giỏ Hàng <span id="cart-total-count" class="muted">(0)</span>
        </h2>
        <div class="ov-actions">
            <button id="clear-all-btn" class="btn btn-danger-ghost" type="button">Xoá tất cả</button>
            <button class="icon-btn" data-close aria-label="Đóng giỏ hàng">
                <svg class="ico"><use href="#i-close"/></svg>
            </button>
        </div>
    </header>

    <div class="ov-body">
        <ul id="selected-list" class="cart-list"></ul>
        <div id="cart-empty" class="empty-state small" hidden>
            <svg class="ico big"><use href="#i-cart"/></svg>
            <p>Giỏ hàng đang trống</p>
        </div>
    </div>

    <footer class="ov-foot">
        <button id="copyBtn" class="btn btn-primary btn-block" type="button">
            <svg class="ico"><use href="#i-copy"/></svg>
            Sao chép danh sách
        </button>
    </footer>
</section>

<!-- ================= KIỂM HÀNG ================= -->
<section id="note-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="note-title">
    <header class="ov-head">
        <h2 id="note-title">
            <svg class="ico"><use href="#i-note"/></svg>
            Kiểm Hàng <span id="note-total-count" class="muted">(0)</span>
        </h2>
        <div class="ov-actions">
            <button id="clear-all-note" class="btn btn-danger-ghost" type="button">Xoá tất cả</button>
            <button class="icon-btn" data-close aria-label="Đóng kiểm hàng">
                <svg class="ico"><use href="#i-close"/></svg>
            </button>
        </div>
    </header>

    <div class="ov-body">
        <div class="paste-box">
            <textarea id="note-input" rows="3" placeholder="Dán danh sách đã sao chép vào đây — mỗi dòng một món…"></textarea>
            <button id="import-note" class="btn btn-primary" type="button">Nhập danh sách</button>
        </div>
        <div id="note-items-container" class="check-list"></div>
        <div id="note-empty" class="empty-state small" hidden>
            <svg class="ico big"><use href="#i-note"/></svg>
            <p>Chưa có món nào để kiểm</p>
        </div>
    </div>

    <footer class="ov-foot">
        <button id="trash-btn" class="btn btn-ghost btn-block" type="button">
            <svg class="ico"><use href="#i-trash"/></svg>
            <span>Thùng rác (<span id="trash-count">0</span>)</span>
        </button>
    </footer>
</section>

<!-- ================= THÙNG RÁC ================= -->
<section id="trash-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="trash-title">
    <header class="ov-head">
        <h2 id="trash-title">
            <svg class="ico"><use href="#i-trash"/></svg>
            Thùng Rác <span id="trash-total-count" class="muted">(0)</span>
        </h2>
        <div class="ov-actions">
            <button id="clear-all-trash" class="btn btn-danger-ghost" type="button">Xoá tất cả</button>
            <button class="icon-btn" data-close aria-label="Đóng thùng rác">
                <svg class="ico"><use href="#i-close"/></svg>
            </button>
        </div>
    </header>
    <div class="ov-body">
        <div id="trash-items-container" class="check-list"></div>
        <div id="trash-empty" class="empty-state small" hidden>
            <svg class="ico big"><use href="#i-trash"/></svg>
            <p>Thùng rác đang trống</p>
        </div>
    </div>
</section>

<!-- ================= LỊCH SỬ ================= -->
<section id="history-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="history-title">
    <header class="ov-head">
        <h2 id="history-title">
            <svg class="ico"><use href="#i-history"/></svg>
            Lịch Sử
        </h2>
        <div class="ov-actions">
            <button id="clear-history" class="btn btn-danger-ghost" type="button">Xoá tất cả</button>
            <button class="icon-btn" data-close aria-label="Đóng lịch sử">
                <svg class="ico"><use href="#i-close"/></svg>
            </button>
        </div>
    </header>
    <div class="ov-body">
        <div id="history-content" class="history-list"></div>
        <div id="history-empty" class="empty-state small" hidden>
            <svg class="ico big"><use href="#i-history"/></svg>
            <p>Chưa có hoạt động nào</p>
        </div>
    </div>
</section>

<!-- ================= XÁC NHẬN ================= -->
<div id="confirm-overlay" class="confirm-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-message">
    <div class="confirm-box">
        <p id="confirm-message"></p>
        <div class="confirm-buttons">
            <button id="confirm-no" class="btn btn-ghost" type="button">Huỷ</button>
            <button id="confirm-yes" class="btn btn-danger" type="button">Đồng ý</button>
        </div>
    </div>
</div>

<!-- ================= ZOOM ẢNH ================= -->
<div id="image-zoom-overlay" class="zoom-overlay" aria-hidden="true">
    <img id="zoomed-image" src="" alt="">
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<noscript>
    <p style="padding:20px;color:#fff">Trang này cần JavaScript để hoạt động.</p>
</noscript>

<script src="products.js"></script>
<script src="app.js"></script>
</body>
</html>
